[tools]
java = "temurin-25.0.3+9.0.LTS"
node = "24.18.1"

[tasks.setup]
description = "Install npm dependencies and Playwright Chromium; --ci uses frozen dependencies"
usage = '''
flag "--ci" help="Use npm ci and install browser system dependencies"
'''
run = '''
set -eu
if [ "${usage_ci:-false}" = true ]; then
  npm --prefix frontend ci
  npm --prefix backend-simulator ci
  npm --prefix frontend exec -- playwright install --with-deps chromium
else
  npm --prefix frontend install
  npm --prefix backend-simulator install
  npm --prefix frontend exec -- playwright install chromium
fi
'''

[tasks.start]
description = "Start a component or all development services"
usage = '''
arg "[target]" {
  choices "frontend" "backend" "simulator" "storybook"
}
flag "--all" help="Run for all supported targets"
'''
run = '''
set -eu
target="${usage_target:-}"
if [ "${usage_all:-false}" = true ]; then
  if [ -n "$target" ]; then
    echo "Choose a target or --all, not both." >&2
    exit 2
  fi
  target=all
elif [ -z "$target" ]; then
  exec mise run start --help
fi
unset usage_target usage_all
case "$target" in
  frontend) exec npm --prefix frontend start ;;
  backend) exec ./gradlew :backend:bootRun --console=plain ;;
  simulator)
    npm --prefix backend-simulator run build
    exec npm --prefix backend-simulator start
    ;;
  storybook) exec npm --prefix frontend run storybook ;;
  all) exec mise run --jobs 4 start frontend ::: start backend ::: start simulator ::: start storybook ;;
esac
'''

[tasks.build]
description = "Build a component or all application and workshop artifacts"
usage = '''
arg "[target]" {
  choices "frontend" "backend" "simulator" "storybook"
}
flag "--all" help="Run for all supported targets"
'''
run = '''
set -eu
target="${usage_target:-}"
if [ "${usage_all:-false}" = true ]; then
  if [ -n "$target" ]; then
    echo "Choose a target or --all, not both." >&2
    exit 2
  fi
  target=all
elif [ -z "$target" ]; then
  exec mise run build --help
fi
unset usage_target usage_all
if [ "$target" = backend ] || [ "$target" = all ]; then
  ./gradlew :backend:bootJar
fi
if [ "$target" = frontend ] || [ "$target" = all ]; then
  npm --prefix frontend run build
fi
if [ "$target" = simulator ] || [ "$target" = all ]; then
  npm --prefix backend-simulator run build
fi
if [ "$target" = storybook ] || [ "$target" = all ]; then
  npm --prefix frontend run storybook:build
fi
'''

[tasks.verify]
description = "Verify a component; no arguments or --all runs every repository gate"
usage = '''
arg "[target]" {
  choices "frontend" "backend" "simulator" "requirements" "legacy"
}
flag "--all" help="Run for all supported targets"
'''
run = '''
set -eu
target="${usage_target:-}"
if [ "${usage_all:-false}" = true ]; then
  if [ -n "$target" ]; then
    echo "Choose a target or --all, not both." >&2
    exit 2
  fi
  target=all
elif [ -z "$target" ]; then
  target=all
fi
unset usage_target usage_all
if [ "$target" = all ]; then
  mise tasks validate
  python3 -m unittest discover -s scripts -p 'test_mise_tasks.py'
  exec mise run verify backend ::: verify frontend ::: verify simulator ::: verify requirements ::: verify legacy
fi
case "$target" in
  backend) exec ./gradlew :backend:check ;;
  frontend) exec npm --prefix frontend run verify ;;
  simulator) exec npm --prefix backend-simulator run verify ;;
  requirements)
    python3 -m py_compile scripts/update_requirements_index.py scripts/test_update_requirements_index.py
    python3 -m unittest discover -s scripts -p 'test_update_requirements_index.py'
    exec python3 scripts/update_requirements_index.py --check
    ;;
  legacy) exec ./scripts/verify.sh ;;
esac
'''

[tasks.verify-legacy]
description = "Compatibility entry point for the offline legacy quality gate"
hide = true
run = "mise run verify legacy"

[tasks.ci]
description = "Install frozen dependencies, then run every repository quality gate"
run = [
  "mise run setup --ci",
  "mise run verify --all",
]

[tasks.clean]
description = "Remove generated backend, frontend, simulator, and browser-test outputs"
run = [
  "./gradlew :backend:clean",
  "node -e \"for (const path of ['frontend/dist', 'frontend/storybook-static', 'frontend/playwright-report', 'frontend/test-results', 'backend-simulator/dist']) require('node:fs').rmSync(path, { recursive: true, force: true })\"",
]
